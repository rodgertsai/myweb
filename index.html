<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>健康狀態記錄簿</title>
  
  <!-- 引入 Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* 選中項目高亮與光暈效果 */
    .status-input:checked + .status-card {
      border-color: #2563eb;
      background-color: #eff6ff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
    }
    .status-input:checked + .status-card .status-radio-dot {
      border-color: #2563eb;
      background-color: #2563eb;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-6 px-3 sm:px-6 flex justify-center items-start">

  <div class="w-full max-w-lg bg-white rounded-2xl shadow-md border border-slate-200 p-5 sm:p-7 space-y-6">
    
    <!-- 頁面標題 -->
    <header class="border-b border-slate-100 pb-4 text-center sm:text-left">
      <div class="flex items-center justify-between">
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 flex items-center gap-2">
          <span class="text-blue-600">📊</span> 健康狀態記錄
        </h1>
        <span class="text-xs bg-blue-50 text-blue-700 font-semibold px-2.5 py-1 rounded-full border border-blue-200">
          v2.0
        </span>
      </div>
      <p class="text-xs sm:text-sm text-slate-500 mt-1">追蹤夜尿狀況與晨起精神狀態</p>
    </header>

    <!-- 主表單 -->
    <form id="trackerForm" class="space-y-5">
      
      <!-- 1. 記錄日期 -->
      <div>
        <label for="recordDate" class="block text-sm font-bold text-slate-700 mb-1.5">
          📅 記錄日期
        </label>
        <input type="date" id="recordDate" required
               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-slate-800 text-sm font-medium bg-white">
      </div>

      <!-- 2. 五個健康狀態選項 -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">
          🛌 晨起與夜尿狀態
        </label>
        
        <div class="space-y-2.5" id="statusGroup">
          
          <!-- 選項 1：綠色 -->
          <label class="block cursor-pointer">
            <input type="radio" name="healthOption" value="1. 無夜尿(狀態佳)" class="hidden status-input" checked>
            <div class="status-card p-3.5 rounded-xl border-2 border-slate-200 bg-slate-50/60 hover:bg-slate-50 transition flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="w-4 h-4 rounded-md bg-emerald-500 shadow-sm shrink-0"></span>
                <span class="text-sm sm:text-base font-semibold text-slate-800">1. 無夜尿（狀態佳）</span>
              </div>
              <div class="status-radio-dot w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0">
                <div class="w-2 h-2 rounded-full bg-white"></div>
              </div>
            </div>
          </label>

          <!-- 選項 2：淺綠色 -->
          <label class="block cursor-pointer">
            <input type="radio" name="healthOption" value="2. 無夜尿(狀態欠佳)" class="hidden status-input">
            <div class="status-card p-3.5 rounded-xl border-2 border-slate-200 bg-slate-50/60 hover:bg-slate-50 transition flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="w-4 h-4 rounded-md bg-lime-500 shadow-sm shrink-0"></span>
                <span class="text-sm sm:text-base font-semibold text-slate-800">2. 無夜尿（狀態欠佳）</span>
              </div>
              <div class="status-radio-dot w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0">
                <div class="w-2 h-2 rounded-full bg-white"></div>
              </div>
            </div>
          </label>

          <!-- 選項 3：琥珀黃 -->
          <label class="block cursor-pointer">
            <input type="radio" name="healthOption" value="3. 夜尿一次(尚有精神)" class="hidden status-input">
            <div class="status-card p-3.5 rounded-xl border-2 border-slate-200 bg-slate-50/60 hover:bg-slate-50 transition flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="w-4 h-4 rounded-md bg-amber-500 shadow-sm shrink-0"></span>
                <span class="text-sm sm:text-base font-semibold text-slate-800">3. 夜尿一次（尚有精神）</span>
              </div>
              <div class="status-radio-dot w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0">
                <div class="w-2 h-2 rounded-full bg-white"></div>
              </div>
            </div>
          </label>

          <!-- 選項 4：暖橘色 -->
          <label class="block cursor-pointer">
            <input type="radio" name="healthOption" value="4. 夜尿一次(沒精神)" class="hidden status-input">
            <div class="status-card p-3.5 rounded-xl border-2 border-slate-200 bg-slate-50/60 hover:bg-slate-50 transition flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="w-4 h-4 rounded-md bg-orange-500 shadow-sm shrink-0"></span>
                <span class="text-sm sm:text-base font-semibold text-slate-800">4. 夜尿一次（沒精神）</span>
              </div>
              <div class="status-radio-dot w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0">
                <div class="w-2 h-2 rounded-full bg-white"></div>
              </div>
            </div>
          </label>

          <!-- 選項 5：紅色 -->
          <label class="block cursor-pointer">
            <input type="radio" name="healthOption" value="5. 夜尿兩次以上" class="hidden status-input">
            <div class="status-card p-3.5 rounded-xl border-2 border-slate-200 bg-slate-50/60 hover:bg-slate-50 transition flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="w-4 h-4 rounded-md bg-rose-500 shadow-sm shrink-0"></span>
                <span class="text-sm sm:text-base font-semibold text-slate-800">5. 夜尿兩次以上</span>
              </div>
              <div class="status-radio-dot w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0">
                <div class="w-2 h-2 rounded-full bg-white"></div>
              </div>
            </div>
          </label>

        </div>
      </div>

      <!-- 3. 備註輸入框 -->
      <div>
        <label for="recordNotes" class="block text-sm font-bold text-slate-700 mb-1.5">
          📝 備註事項
        </label>
        <textarea id="recordNotes" rows="3" placeholder="（選填）紀錄入睡時間、晚餐飲食、特殊症狀或活動心得..."
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-slate-800 text-sm resize-none"></textarea>
      </div>

      <!-- 4. 操作按鈕 -->
      <div class="pt-2 flex flex-col sm:flex-row gap-3">
        <button type="submit"
                class="w-full sm:flex-1 py-3 px-5 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition duration-150 flex items-center justify-center gap-2">
          <span>💾</span> 提交記錄
        </button>
        <button type="button" id="exportBtn"
                class="w-full sm:w-auto py-3 px-5 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold rounded-xl shadow transition duration-150 flex items-center justify-center gap-2">
          <span>📊</span> 匯出 CSV
        </button>
      </div>

    </form>

    <!-- 歷史紀錄區域 -->
    <section class="border-t border-slate-100 pt-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm sm:text-base font-bold text-slate-900 flex items-center gap-2">
          <span>🕒</span> 歷史記錄
        </h2>
        <span id="totalBadge" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full font-bold">
          0 筆
        </span>
      </div>

      <!-- 列表容器 -->
      <div id="logsContainer" class="space-y-2.5 max-h-72 overflow-y-auto pr-1">
        <!-- JS 動態插入 -->
      </div>
    </section>

  </div>

  <script>
    const STORAGE_KEY = 'health_tracker_records_v2';

    // 狀態對應色彩樣式
    const badgeColors = {
      '1': 'bg-emerald-50 text-emerald-700 border-emerald-200',
      '2': 'bg-lime-50 text-lime-700 border-lime-200',
      '3': 'bg-amber-50 text-amber-700 border-amber-200',
      '4': 'bg-orange-50 text-orange-700 border-orange-200',
      '5': 'bg-rose-50 text-rose-700 border-rose-200'
    };

    // 自動帶入當前日期
    const dateInput = document.getElementById('recordDate');
    dateInput.value = new Date().toISOString().split('T')[0];

    // 讀取 LocalStorage
    function fetchLogs() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (err) {
        return [];
      }
    }

    // 儲存至 LocalStorage
    function persistLogs(logs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    }

    // 渲染歷史清單
    function renderList() {
      const logs = fetchLogs();
      const container = document.getElementById('logsContainer');
      const badge = document.getElementById('totalBadge');
      
      badge.textContent = `${logs.length} 筆`;

      if (logs.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-sm border-2 border-dashed border-slate-100 rounded-xl">
            目前尚無紀錄，請於上方填寫後提交
          </div>
        `;
        return;
      }

      container.innerHTML = logs.map((item, index) => {
        const code = item.status.charAt(0);
        const style = badgeColors[code] || 'bg-slate-100 text-slate-700 border-slate-200';

        return `
          <div class="p-3.5 bg-slate-50 border border-slate-200/80 rounded-xl flex items-start justify-between gap-3 text-sm">
            <div class="space-y-1.5 flex-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-bold text-slate-800">${item.date}</span>
                <span class="text-xs px-2 py-0.5 font-bold rounded-md border ${style}">
                  ${item.status}
                </span>
              </div>
              ${item.notes ? `<p class="text-slate-600 text-xs leading-relaxed break-words bg-white/70 p-2 rounded-lg border border-slate-100">${escapeHtml(item.notes)}</p>` : ''}
              <div class="text-[11px] text-slate-400">記錄時間：${item.time}</div>
            </div>
            <button onclick="removeItem(${index})" class="text-slate-400 hover:text-rose-600 p-1 transition" title="刪除">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        `;
      }).join('');
    }

    // HTML 安全跳脫
    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    // 刪除紀錄
    window.removeItem = function(index) {
      if (confirm('確定要刪除這筆健康記錄嗎？')) {
        const logs = fetchLogs();
        logs.splice(index, 1);
        persistLogs(logs);
        renderList();
      }
    };

    // 表單提交
    document.getElementById('trackerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const date = dateInput.value;
      const statusRadio = document.querySelector('input[name="healthOption"]:checked');
      const status = statusRadio ? statusRadio.value : '';
      const notes = document.getElementById('recordNotes').value.trim();
      const now = new Date();
      const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const newRecord = { date, status, notes, time };

      const logs = fetchLogs();
      logs.unshift(newRecord);
      persistLogs(logs);

      // 清空備註
      document.getElementById('recordNotes').value = '';
      renderList();
      alert('✅ 健康記錄已儲存！');
    });

    // 匯出 CSV（含 UTF-8 BOM）
    document.getElementById('exportBtn').addEventListener('click', function() {
      const logs = fetchLogs();
      if (logs.length === 0) {
        alert('目前沒有任何紀錄可匯出。');
        return;
      }

      let csv = "\uFEFF"; // 加入 UTF-8 BOM 避免 Excel 開啟中文亂碼
      csv += "記錄日期,狀態,備註事項,記錄時間\n";

      logs.forEach(item => {
        const cleanNotes = (item.notes || '').replace(/"/g, '""');
        csv += `"${item.date}","${item.status}","${cleanNotes}","${item.time}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const filename = `健康狀態記錄_${new Date().toISOString().split('T')[0]}.csv`;

      // 優先使用 Web Share API（手機可直接儲存至 Google Drive 或檔案）
      if (navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: 'text/csv' })] })) {
        const file = new File([blob], filename, { type: 'text/csv' });
        navigator.share({
          files: [file],
          title: '匯出健康狀態記錄',
          text: '健康記錄 CSV 檔案'
        }).catch(() => {
          downloadFile(blob, filename);
        });
      } else {
        downloadFile(blob, filename);
      }
    });

    function downloadFile(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 初次載入渲染
    renderList();
  </script>
</body>
</html>
